<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景：暖色渐变 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E8D5BE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 麦克风主体 - 大而饱满 -->
  <rect x="192" y="88" width="128" height="210" rx="64" ry="64" fill="#D4A574"/>

  <!-- 麦克风高光 -->
  <rect x="216" y="100" width="32" height="140" rx="16" ry="16" fill="#E0B88A" opacity="0.5"/>

  <!-- 麦克风横纹 -->
  <line x1="220" y1="195" x2="292" y2="195" stroke="#FFFBF5" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="220" y1="220" x2="292" y2="220" stroke="#FFFBF5" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="220" y1="245" x2="292" y2="245" stroke="#FFFBF5" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- 麦克风支架弧线 -->
  <path d="M152 260 Q152 370 256 370 Q360 370 360 260" fill="none" stroke="#C4935E" stroke-width="16" stroke-linecap="round"/>

  <!-- 支架竖线 -->
  <line x1="256" y1="370" x2="256" y2="420" stroke="#C4935E" stroke-width="16" stroke-linecap="round"/>

  <!-- 底座 -->
  <line x1="196" y1="420" x2="316" y2="420" stroke="#C4935E" stroke-width="16" stroke-linecap="round"/>

  <!-- 声波左 -->
  <path d="M130 175 Q108 230 130 285" fill="none" stroke="#C4935E" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  <path d="M100 150 Q68 230 100 310" fill="none" stroke="#C4935E" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

  <!-- 声波右 -->
  <path d="M382 175 Q404 230 382 285" fill="none" stroke="#C4935E" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  <path d="M412 150 Q444 230 412 310" fill="none" stroke="#C4935E" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
</svg>
